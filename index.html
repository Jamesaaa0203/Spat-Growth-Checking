<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#EAEFF5">
    <title>Bon Aqua — Shell Length Logger</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#EAEFF5; --surface:#FFFFFF; --surface-2:#F6F9FC;
            --border:#DCE4EE; --border-2:#C8D4E2; --text:#0B1B33; --text-mut:#5B6B82; --text-dim:#8896A8;
            --accent:#0EA5E9; --ok:#0D9488; --alert:#E11D48;
            --shadow:0 1px 2px rgba(13,28,58,.06), 0 8px 24px -12px rgba(13,28,58,.18);
        }
        body.dark {
            --bg:#08101F; --surface:#0F1B38; --surface-2:#0C1730;
            --border:#1E2F50; --border-2:#2A3F66; --text:#EAF1FA; --text-mut:#93A3BD; --text-dim:#64748B;
            --accent:#38BDF8; --ok:#2DD4BF; --alert:#FB7185;
            --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 40px -20px rgba(0,0,0,.7);
        }
        * { -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; transition:background-color .4s,color .4s; }
        h1,h2,h3,.num { font-family:'Space Grotesk','Inter',sans-serif; }
        .eyebrow { font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); }
        .wordmark { font-weight:700; letter-spacing:-.02em; font-size:19px; line-height:1; }
        .wordmark .sub { color:var(--accent); }
        .gas-input { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:11px 14px; font-size:16px; color:var(--text); outline:none; transition:border-color .2s; }
        .gas-input:focus { border-color:var(--accent); }
        .icon-btn { width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:1px solid var(--border); color:var(--text-mut); }
        .pill { font-size:12px; font-weight:700; padding:4px 6px 4px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:4px;
                background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); }
        .pill button { color:var(--alert); font-weight:700; padding:0 6px; font-size:14px; line-height:1; }
    </style>
</head>
<body class="flex flex-col min-h-screen antialiased pb-12">

    <header class="sticky top-0 z-40 px-4 py-3 flex justify-between items-center"
            style="background:color-mix(in srgb,var(--surface) 90%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding-top:calc(.75rem + env(safe-area-inset-top));">
        <div class="wordmark">Bon Aqua <span class="sub">Ops</span></div>
        <div class="flex items-center gap-2">
            <button onclick="toggleTheme()" class="icon-btn text-xs font-bold" title="Toggle theme">🌗</button>
            <div class="px-3 py-1.5 rounded-full font-semibold text-xs" style="background:var(--surface-2); border:1px solid var(--border);"><span class="num" id="live-clock">00:00</span></div>
        </div>
    </header>

    <main class="flex-1 p-4 space-y-4 max-w-md mx-auto w-full">
        <div class="flex items-center justify-between px-1 pt-1">
            <span class="eyebrow">Shell Length · Panjang Cengkerang</span>
            <span class="eyebrow" style="color:var(--text-mut);">Tank 01 – 80</span>
        </div>

        <div class="card p-6 space-y-5">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="eyebrow block mb-1.5">Tarikh / Date</label>
                    <input type="date" id="log-date" class="gas-input">
                </div>
                <div>
                    <label class="eyebrow block mb-1.5">No. Tangki / Tank</label>
                    <select id="log-tank" class="gas-input">
                        <option value="">-- Pilih --</option>
                    </select>
                </div>
            </div>

            <div class="border-t pt-4" style="border-color:var(--border);">
                <div class="flex justify-between items-center mb-2">
                    <span class="eyebrow" style="color:var(--ok);">Panjang / Length (cm)</span>
                    <span class="num text-xs font-bold px-2 py-0.5 rounded-md" style="background:color-mix(in srgb,var(--ok) 12%,transparent); color:var(--ok);" id="pill-count">0 sampel</span>
                </div>

                <div class="flex gap-2 items-end mb-3">
                    <input type="number" step="0.01" inputmode="decimal" id="length-input" placeholder="cth / e.g. 1.25" class="gas-input flex-1">
                    <button onclick="addLength()" class="px-5 py-3 rounded-xl font-bold text-sm shrink-0 active:scale-95 transition-transform" style="background:var(--surface-2); border:1px solid var(--border-2);">+ Add</button>
                </div>

                <div id="pills-container" class="flex flex-wrap gap-2 p-3 min-h-[60px] max-h-[220px] overflow-y-auto rounded-xl border border-dashed" style="background:var(--surface-2); border-color:var(--border-2);">
                    <p id="pills-placeholder" class="text-xs self-center mx-auto" style="color:var(--text-dim);">Belum ada saiz. Masukkan di atas.</p>
                </div>

                <button id="clear-btn" onclick="clearAll()" class="mt-2 text-xs font-semibold hidden" style="color:var(--alert);">Kosongkan semua / Clear all</button>
            </div>

            <button id="submit-btn" onclick="submitLengths()" class="w-full py-3.5 text-sm font-semibold text-white rounded-xl active:scale-[0.98] transition-transform flex justify-center items-center gap-2" style="background:var(--accent);">
                <span>🚀 Hantar / Submit</span>
            </button>
        </div>
    </main>

    <script>
        // Google Apps Script web app URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxQukehQDiY-9OUJFN-7i0E3BTDfcah6XE8Xsbnjc1BrRyfb6zAc9ARObnLxcqEzVW7g/exec";

        const MIN_CM = 0.1, MAX_CM = 10.0;
        let lengths = [];

        const tankSelect = document.getElementById('log-tank');
        const lengthInput = document.getElementById('length-input');

        // Tank 01 - Tank 80
        for (let i = 1; i <= 80; i++) {
            const id = `Tank ${String(i).padStart(2, '0')}`;
            tankSelect.add(new Option(id, id));
        }

        // Default date = today (local time)
        function todayLocal() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        document.getElementById('log-date').value = todayLocal();

        lengthInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); addLength(); }
        });

        function addLength() {
            const val = parseFloat(lengthInput.value);
            if (isNaN(val)) return;
            if (val < MIN_CM || val > MAX_CM) {
                alert(`Sila periksa saiz. Nilai mestilah di antara ${MIN_CM} cm dan ${MAX_CM} cm.`);
                return;
            }
            lengths.push(Math.round(val * 100) / 100);
            lengthInput.value = '';
            lengthInput.focus();
            vibrate(25);
            render();
        }

        function removeLength(i) {
            lengths.splice(i, 1);
            vibrate(35);
            render();
            lengthInput.focus();
        }

        function clearAll() {
            if (!confirm('Padam semua saiz? / Delete all lengths?')) return;
            lengths = [];
            render();
        }

        function render() {
            const container = document.getElementById('pills-container');
            container.querySelectorAll('.pill').forEach(el => el.remove());
            document.getElementById('pills-placeholder').style.display = lengths.length ? 'none' : 'block';
            document.getElementById('pill-count').textContent = `${lengths.length} sampel`;
            document.getElementById('clear-btn').classList.toggle('hidden', lengths.length === 0);

            lengths.forEach((len, i) => {
                const pill = document.createElement('span');
                pill.className = 'pill';
                pill.innerHTML = `#${i + 1}: ${len.toFixed(2)} <button onclick="removeLength(${i})">×</button>`;
                container.appendChild(pill);
            });
            container.scrollTop = container.scrollHeight;
        }

        function submitLengths() {
            const date = document.getElementById('log-date').value;
            const tankId = tankSelect.value;

            if (!date || !tankId || lengths.length === 0) {
                alert('Sila pilih tarikh, tangki, dan masukkan sekurang-kurangnya satu saiz.');
                return;
            }
            if (!confirm(`Hantar ${lengths.length} saiz untuk ${tankId}?`)) return;

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span>⏳ Menghantar...</span>';
            vibrate(50);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ date, tankId, lengths })
            })
            .then(() => {
                vibrate([60, 40, 60]);
                alert(`Berjaya! ${lengths.length} saiz untuk ${tankId} telah dihantar. ✓`);
                lengths = [];
                tankSelect.value = '';
                render();
            })
            .catch(err => {
                console.error(err);
                alert('Gagal menghantar. Semak sambungan internet dan cuba lagi. Data anda masih ada.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<span>🚀 Hantar / Submit</span>';
            });
        }

        function toggleTheme() { vibrate(30); document.body.classList.toggle('dark'); }
        function vibrate(d) { if ('vibrate' in navigator) navigator.vibrate(d); }

        function tick() { document.getElementById('live-clock').textContent = new Date().toTimeString().substring(0, 5); }
        tick(); setInterval(tick, 1000);
    </script>
</body>
</html>
